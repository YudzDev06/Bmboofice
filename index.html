<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBM Office</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f9;
}

.container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:16px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

/* LOGO */

.logo{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* JUDUL */

h1{
    margin:0;
    color:#0757b8;
    font-size:28px;
}

.subtitle{
    margin-top:8px;
    margin-bottom:30px;
    color:#777;
    font-size:14px;
}

/* MENU */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    min-height:125px;
    border:none;
    border-radius:12px;
    padding:18px 10px;
    background:#0757b8;
    color:white;
    cursor:pointer;
    transition:.2s;
}

.menu button:hover{
    background:#06499a;
    transform:translateY(-3px);
}

.icon{
    display:block;
    font-size:32px;
    margin-bottom:10px;
}

.button-title{
    display:block;
    font-size:15px;
    font-weight:bold;
}

.button-desc{
    display:block;
    font-size:10px;
    margin-top:6px;
    opacity:.85;
}

.footer{
    margin-top:30px;
    font-size:10px;
    color:#999;
}

/* HP */

@media(max-width:600px){

    .card{
        padding:30px 20px;
    }

    h1{
        font-size:24px;
    }

    .menu{
        grid-template-columns:1fr;
    }

}
</style>

</head>

<body>

<div class="container">

<div class="card">

    <!-- LOGO -->
    <div class="logo">
        <img src="logo.jpg" alt="Logo Perusahaan">
    </div>

    <!-- JUDUL -->
    <h1>BBM OFFICE</h1>

    <div class="subtitle">
        Sistem Administrasi & Dokumen
    </div>

    <!-- MENU -->
    <div class="menu">

        <!-- INVOICE -->
        <a href="invoice.html">
            <button>

                <span class="icon">🧾</span>

                <span class="button-title">
                    Generator Invoice
                </span>

                <span class="button-desc">
                    Membuat invoice secara otomatis
                </span>

            </button>
        </a>


        <!-- SURAT PENAWARAN -->
        <a href="penawaran.html">
            <button>

                <span class="icon">📄</span>

                <span class="button-title">
                    Surat Penawaran
                </span>

                <span class="button-desc">
                    Membuat surat penawaran harga
                </span>

            </button>
        </a>

    </div>

    <div class="footer">
        PT. BERKAH MANDIRI BERSAUDARA
    </div>

</div>

</div>

</body>
</html>
